<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up - HealthLog</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#985e25",
                        "on-secondary-fixed": "#0e1e1e",
                        "on-primary-fixed-variant": "#004e5b",

                        "on-surface": "#191c1d",

                        "inverse-on-surface": "#eff1f1",
                        "secondary-fixed-dim": "#b8cac9",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#d4e6e5",
                        "surface": "#f8fafa",
                        "surface-dim": "#d8dada",
                        "outline": "#6f797c",
                        "on-surface-variant": "#3e484b",
                        "on-secondary-container": "#576867",
                        "on-tertiary": "#ffffff",
                        "secondary-container": "#d4e6e5",
                        "inverse-surface": "#2e3131",
                        "error": "#ba1a1a",
                        "background": "#f8fafa",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#80d3e6",

                        "surface-container-low": "#f2f4f4",

                        "on-background": "#191c1d",
                        "inverse-primary": "#80d3e6",
                        "primary": "#005c6b",
                        "tertiary-fixed-dim": "#ffb779",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#ffeadb",
                        "on-primary-container": "#cdf4ff",
                        "secondary": "#516161",
                        "tertiary-fixed": "#ffdcc1",
                        "surface-variant": "#e1e3e3",
                        "tertiary": "#7b460e",
                        "on-tertiary-fixed": "#2e1500",
                        "primary-container": "#0e7688",
                        "surface-bright": "#f8fafa",
                        "primary-fixed": "#a8edff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "stack-md": "24px",
                        "stack-sm": "12px",
                        "stack-lg": "40px",
                        "margin-mobile": "20px",
                        "gutter-card": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Atkinson Hyperlegible Next"],
                        "body-lg": ["Atkinson Hyperlegible Next"],
                        "body-md": ["Atkinson Hyperlegible Next"],
                        "label-md": ["Atkinson Hyperlegible Next"],

                        "label-sm": ["Atkinson Hyperlegible Next"]
                    },
                    "fontSize": {

                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600" }],

            }
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Suppressed navigation shell (TopAppBar & BottomNavBar) as this is a linear transactional sign-up screen -->
<main class="w-full max-w-[400px] flex flex-col items-center gap-stack-lg">
<!-- Header Section -->
<div class="text-center w-full space-y-stack-sm">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container text-on-primary-container mb-2">
<span class="material-symbols-outlined text-[32px] icon-fill">healing</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join HealthLog to securely manage your records.</p>
</div>
<!-- Content Canvas -->
<div class="w-full bg-surface shadow-[0px_4px_12px_rgba(0,0,0,0.05)] rounded-xl p-gutter-card space-y-stack-md">
<!-- SSO Button -->
<button class="w-full min-h-[48px] flex items-center justify-center gap-2 bg-surface-container-low hover:bg-surface-container-high text-on-surface font-label-md text-label-md rounded-lg border border-outline-variant transition-colors">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
<!-- Divider -->
<div class="flex items-center gap-4 w-full">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-sm text-label-sm text-outline">or manually</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<!-- Manual Sign-up Form -->
<form class="w-full space-y-stack-sm flex flex-col">
<!-- Name Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="name">Full Name</label>
<input class="min-h-[48px] w-full rounded-lg border border-outline bg-surface-container-lowest px-4 font-body-md text-body-md text-on-surface focus:border-primary focus:border-2 focus:ring-0 focus:outline-none transition-all" id="name" name="name" type="text"/>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<input class="min-h-[48px] w-full rounded-lg border border-outline bg-surface-container-lowest px-4 font-body-md text-body-md text-on-surface focus:border-primary focus:border-2 focus:ring-0 focus:outline-none transition-all" id="email" name="email" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="password">Create Password</label>
<div class="relative w-full">
<input class="min-h-[48px] w-full rounded-lg border border-outline bg-surface-container-lowest px-4 pr-12 font-body-md text-body-md text-on-surface focus:border-primary focus:border-2 focus:ring-0 focus:outline-none transition-all" id="password" name="password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary p-1 flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full min-h-[48px] bg-primary text-on-primary font-label-md text-label-md rounded-lg flex items-center justify-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-md active:opacity-80" type="submit">
<span class="material-symbols-outlined text-[20px]">person_add</span>
                        Sign Up
                    </button>
</div>
</form>
</div>
<div class="text-center w-full">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? <a class="text-primary font-label-md text-label-md hover:underline" href="#">Log in</a>
</p>
</div>
</main>
</body></html>
