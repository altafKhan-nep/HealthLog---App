<body class="bg-background text-on-background min-h-screen flex flex-col antialiased pb-safe">
<!-- Top App Bar (Suppressed because this is a transactional flow, but keeping a simple close action) -->
<header class="w-full flex items-center justify-between px-margin-mobile h-16 max-w-md mx-auto relative z-10 bg-background">
<button class="p-2 -ml-2 text-on-surface-variant hover:opacity-80 transition-opacity duration-200 focus:outline-none focus:ring-2 focus:ring-primary rounded-full">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<span class="font-label-md text-label-md text-on-surface-variant">Step 2 of 5</span>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-md mx-auto px-margin-mobile pt-stack-sm pb-[120px] relative z-0 flex flex-col">
<!-- Progress Bar -->
<div class="w-full h-1 bg-surface-container-high rounded-full mb-stack-md overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-in-out w-[40%]"></div>
</div>
<!-- Section Title -->
<div class="mb-stack-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background mb-1">
                Which doctor did you see?
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                (optional)
            </p>
</div>
<!-- Input Section -->
<div class="flex flex-col gap-stack-sm mb-stack-lg">
<div class="relative w-full">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-on-surface-variant pointer-events-none">
<span class="material-symbols-outlined" data-icon="search">search</span>
</span>
<input class="w-full pl-12 pr-4 h-12 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-background placeholder:text-on-surface-variant focus:outline-none focus:ring-0 focus:border-2 focus:border-primary transition-all duration-200" id="doctorSearch" placeholder="Search doctor name..." type="text"/>
</div>
<button class="self-start mt-2">
<span class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors duration-200 underline decoration-1 underline-offset-4">
                     Skip this step
                 </span>
</button>
</div>
<!-- Recent Doctors Suggestion Area -->
<div class="flex flex-col gap-stack-sm">
<p class="font-label-md text-label-md text-on-surface-variant mb-1">RECENTLY VISITED</p>
<div class="flex flex-wrap gap-2">
<button class="flex items-center gap-2 bg-surface-container-low border border-outline-variant hover:bg-surface-container-high hover:border-primary text-on-background rounded-full px-4 py-2 transition-all duration-200 group">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant group-hover:text-primary transition-colors" data-icon="person">person</span>
<span class="font-label-md text-label-md">Dr. Sarah Smith</span>
</button>
<button class="flex items-center gap-2 bg-surface-container-low border border-outline-variant hover:bg-surface-container-high hover:border-primary text-on-background rounded-full px-4 py-2 transition-all duration-200 group">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant group-hover:text-primary transition-colors" data-icon="person">person</span>
<span class="font-label-md text-label-md">Dr. James Wilson</span>
</button>
<button class="flex items-center gap-2 bg-surface-container-low border border-outline-variant hover:bg-surface-container-high hover:border-primary text-on-background rounded-full px-4 py-2 transition-all duration-200 group">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant group-hover:text-primary transition-colors" data-icon="person">person</span>

</button>
