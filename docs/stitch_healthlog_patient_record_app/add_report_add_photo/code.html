<div class="w-12 h-12"></div> <!-- Spacer for balance -->
</header>
<!-- Main Canvas -->
<main class="flex-grow w-full max-w-md mx-auto px-margin-mobile pb-32 flex flex-col relative">
<!-- Progress Indicator -->
<div class="mt-stack-sm mb-stack-lg w-full">
<div class="flex justify-between items-center mb-2">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Step 4 of 5</span>

</div>
<!-- Progress Bar -->
<div class="h-1.5 w-full bg-surface-container-high rounded-full overflow-hidden flex">
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-out" style="width: 80%;"></div>
</div>
</div>
<!-- Header Section -->
<div class="mb-stack-lg text-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm">Add a photo of the report</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Capture a clear image of your lab results or medical document to attach it to this entry. (Optional)</p>
</div>
<!-- Action Area - Dynamic based on state -->
<div class="flex-grow flex flex-col items-center justify-center w-full mb-stack-lg">
<!-- State 1: Pre-Upload (Visible by default) -->
<div class="w-full flex flex-col items-center gap-stack-sm transition-opacity duration-300" id="pre-upload-state">
<!-- Primary Action: Take Photo -->
<button class="interactive-element group relative w-full aspect-square max-w-[240px] bg-surface rounded-3xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-surface-container-high flex flex-col items-center justify-center gap-stack-sm hover:shadow-[0px_8px_24px_rgba(0,0,0,0.08)] hover:border-primary-fixed-dim overflow-hidden" onclick="toggleUploadState()">
<!-- Subtle background decoration -->
<div class="absolute inset-0 bg-gradient-to-br from-primary-fixed/20 to-transparent opacity-50"></div>
<div class="w-20 h-20 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container z-10 group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined icon-fill text-4xl">photo_camera</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface z-10">Take Photo</span>
</button>
<!-- Secondary Action: Choose from Gallery -->
<button class="interactive-element mt-stack-sm w-full max-w-[240px] h-12 rounded-full bg-secondary-container text-on-secondary-container font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-surface-variant" onclick="toggleUploadState()">
<span class="material-symbols-outlined text-lg">photo_library</span>
                    Choose from Gallery
                </button>
</div>
<!-- State 2: Post-Upload (Hidden by default) -->
<div class="hidden w-full flex flex-col items-center gap-stack-md transition-opacity duration-300 opacity-0" id="post-upload-state">

<!-- Minimal Script for State Toggling -->
<script>
        function toggleUploadState() {
            const preState = document.getElementById('pre-upload-state');
            const postState = document.getElementById('post-upload-state');
            
            if (preState.classList.contains('hidden')) {
                // Switch to Pre-Upload
                postState.style.opacity = '0';
                setTimeout(() => {
                    postState.classList.add('hidden');
                    preState.classList.remove('hidden');
                    setTimeout(() => {
                        preState.style.opacity = '1';
                    }, 50);
                }, 300);
            } else {
                // Switch to Post-Upload
                preState.style.opacity = '0';
                setTimeout(() => {
                    preState.classList.add('hidden');
                    postState.classList.remove('hidden');
                    setTimeout(() => {
                        postState.style.opacity = '1';
                    }, 50);
                }, 300);
            }
        }
    </script>
