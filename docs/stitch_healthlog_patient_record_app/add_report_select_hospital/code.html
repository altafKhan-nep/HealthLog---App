<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Container -->
<main class="flex-1 flex flex-col max-w-md mx-auto w-full bg-surface shadow-sm min-h-screen relative overflow-hidden">
<!-- Header / Top App Bar -->
<header class="flex items-center justify-between px-margin-mobile h-16 w-full shrink-0 sticky top-0 bg-surface z-10">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-start text-on-surface-variant hover:opacity-80 transition-opacity duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="flex-1 flex justify-center items-center font-headline-md text-headline-md text-primary">
        Add Report
      </div>
<button aria-label="Cancel" class="w-12 h-12 flex items-center justify-end text-on-surface-variant hover:opacity-80 transition-opacity duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</header>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto px-margin-mobile pb-32 hide-scrollbar">
<!-- Progress Indicator -->
<div class="mt-stack-sm mb-stack-lg flex flex-col gap-base">
<div class="flex justify-between items-end">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Step 1 of 5</span>
<span class="font-label-sm text-label-sm text-primary font-medium">Location</span>
</div>
<div class="w-full h-2 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/5 rounded-full transition-all duration-500 ease-out"></div>
</div>
</div>
<!-- Title -->
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-stack-md leading-tight">
        Which hospital or clinic?
      </h1>
<!-- Search Input -->
<div class="relative mb-stack-md group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">search</span>
</div>
<input class="w-full h-[56px] pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant focus:border-primary focus:border-2 focus:ring-0 transition-all shadow-sm" placeholder="Search hospitals or clinics..." type="text"/>
</div>
<!-- Previously Visited Section -->
<div class="flex flex-col gap-stack-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant mb-base px-1">Previously visited</h2>
<!-- Hospital Card 1 -->
<button class="w-full text-left bg-surface-container-lowest border border-surface-container-high rounded-xl p-gutter-card flex items-start gap-4 hover:bg-surface-container-lowest hover:border-primary hover:shadow-[0px_4px_12px_rgba(0,0,0,0.05)] transition-all active:scale-[0.98]">
<div class="w-12 h-12 shrink-0 rounded-full bg-primary-container/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">local_hospital</span>
</div>
<div class="flex-1 flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface line-clamp-1">City General Hospital</span>
<span class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[16px]">location_on</span>
              123 Main St, Downtown
            </span>
<span class="font-label-sm text-label-sm text-secondary mt-2 inline-flex items-center px-2 py-1 bg-surface-container rounded-md w-fit">
              Last visit: Aug 24, 2026
            </span>
</div>
</button>
<!-- Hospital Card 2 -->
<button class="w-full text-left bg-surface-container-lowest border border-surface-container-high rounded-xl p-gutter-card flex items-start gap-4 hover:bg-surface-container-lowest hover:border-primary hover:shadow-[0px_4px_12px_rgba(0,0,0,0.05)] transition-all active:scale-[0.98]">
<div class="w-12 h-12 shrink-0 rounded-full bg-tertiary-container/20 flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">medical_services</span>
</div>
<div class="flex-1 flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface line-clamp-1">Westside Family Clinic</span>
<span class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[16px]">location_on</span>
              450 Oak Ave, Westside
            </span>
<span class="font-label-sm text-label-sm text-secondary mt-2 inline-flex items-center px-2 py-1 bg-surface-container rounded-md w-fit">
              Last visit: Jun 12, 2026
            </span>
</div>
</button>
<!-- Add New Button -->
<button class="w-full mt-stack-sm text-left bg-transparent border-2 border-dashed border-outline-variant rounded-xl p-gutter-card flex items-center gap-4 hover:border-primary hover:bg-primary-fixed/30 transition-all group">
<div class="w-12 h-12 shrink-0 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">add</span>
</div>
<div class="flex-1 flex flex-col">
<span class="font-headline-md text-headline-md text-primary group-hover:text-on-primary-fixed-variant transition-colors">Add a new location</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1">Enter name, type, and address</span>
</div>
</button>
</div>
</div>
<!-- Bottom Action Bar (Fixed) -->
<div class="fixed bottom-0 left-0 w-full max-w-md mx-auto right-0 p-margin-mobile bg-gradient-to-t from-surface via-surface to-transparent pb-safe z-20">
<button class="w-full h-14 bg-surface-container-highest text-on-surface-variant font-label-md text-label-md rounded-full shadow-sm opacity-50 cursor-not-allowed flex items-center justify-center gap-2 transition-all" disabled="">
        Next Step
        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</main>
<script>
    // Add simple interaction for selecting a hospital to enable the next button
    document.addEventListener('DOMContentLoaded', () => {
      const hospitalCards = document.querySelectorAll('.bg-surface-container-lowest.border-surface-container-high');
      const nextButton = document.querySelector('.fixed.bottom-0 button');

      hospitalCards.forEach(card => {
        card.addEventListener('click', () => {
          // Reset all cards
          hospitalCards.forEach(c => {
            c.classList.remove('border-primary', 'bg-primary-fixed/10', 'shadow-[0px_4px_12px_rgba(0,0,0,0.05)]');
            c.classList.add('border-surface-container-high');
            // Reset checkmark if we added one
            const check = c.querySelector('.selection-check');
            if(check) check.remove();
          });

          // Style selected card
          card.classList.remove('border-surface-container-high');
          card.classList.add('border-primary', 'bg-primary-fixed/10', 'shadow-[0px_4px_12px_rgba(0,0,0,0.05)]');
          
          // Add visual checkmark indicator to the selected card's flex container
          if (!card.querySelector('.selection-check')) {
            const checkContainer = document.createElement('div');
            checkContainer.className = 'selection-check w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary ml-auto mt-2';
            checkContainer.innerHTML = '<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: \'FILL\' 1;">check</span>';
            card.appendChild(checkContainer);
          }

          // Enable next button
          nextButton.disabled = false;
          nextButton.className = 'w-full h-14 bg-primary text-on-primary font-label-md text-label-md rounded-full shadow-[0px_4px_12px_rgba(0,0,0,0.15)] flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all';
        });
      });
    });
  </script>
